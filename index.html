<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>
  <header>
    <h1>ー レスポンシブテスト ー</h1>
  </header>
  <section>
    <h2>確認方法</h2>
    <p>デバイスモードで確認（F12 → Ctrl + Shift + M）。またはウィンドウの端をドラッグして縮小・拡大。</p>
  </section>
  <section class="pixel-explain">
    <h2>現在の画面（ウィンドウ）幅</h2>
    <p><span class="pixel"></span>pxです。</p>
  </section>

  <section>
    <h2>デモ実行</h2>
    <div class="square"></div>
    <ul class="condition">
      <li>画面幅が1001px以上になると四角形が<span class="purple">紫色</span>に変化<br>→デフォルト</li>
      <li>画面幅が1000px以下になると四角形が<span class="green">緑色</span>に変化</li>
      <li>画面幅が800px以下になると四角形が<span class="blue">青色</span>に変化</li>
      <li>画面幅が600px以下になると四角形が<span class="red">赤色</span>に変化</li>
    </ul>
  </section>
</body>

</html>
